{% extends "admin/layout.html" %}{% block admin_content %}<h1>Gallery Management</h1><form class="form admin-form" method="post" enctype="multipart/form-data"><label>Photo Title<input name="title"></label><label>Select Photo<input type="file" name="image" accept="image/*" required></label><button class="btn">Upload Photo</button></form><div class="gallery admin-gallery">{% for g in gallery %}<figure><img src="{{url_for('static',filename='uploads/'+g.image)}}"><figcaption>{{g.title}} <a class="danger" href="{{url_for('delete_gallery',gid=g.id)}}" onclick="return confirm('Delete photo?')">Delete</a></figcaption></figure>{% endfor %}</div>{% endblock %}

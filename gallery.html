{% extends "base.html" %}

{% block content %}
<section class="page-head">
  <span class="eyebrow">CAMPUS GALLERY</span>
  <h1>Gallery</h1>
  <p>Moments and memories from our college.</p>
</section>

<section class="section">
  <div class="gallery big">
    {% for g in gallery %}
    <figure>
      <img src="{{ url_for('static', filename='uploads/' + g.image) }}" alt="{{ g.title }}">
      <figcaption>{{ g.title }}</figcaption>
    </figure>
    {% endfor %}
  </div>
</section>
{% endblock %}

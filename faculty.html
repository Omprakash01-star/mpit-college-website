{% extends "base.html" %}{% block content %}<section class="page-head"><span class="eyebrow">OUR TEAM</span><h1>Faculty</h1></section><section class="section"><div class="grid three">{% for f in faculty %}<article class="person">{% if f.photo %}<img src="{{url_for('static',filename='uploads/'+f.photo)}}">{% else %}<div class="avatar">👤</div>{% endif %}<h2>{{f.name}}</h2><p>{{f.designation}}</p><small>{{f.qualification}}</small></article>{% endfor %}</div></section>{% endblock %}

{% extends "admin/layout.html" %}{% block admin_content %}<h1>Faculty Management</h1><form class="form admin-form" method="post" enctype="multipart/form-data"><input type="hidden" name="id" value=""><label>Name<input name="name" required></label><label>Designation<input name="designation" required></label><label>Qualification<input name="qualification"></label><label>Photo<input type="file" name="photo" accept="image/*"></label><button class="btn">Add Faculty</button></form><div class="admin-list">{% for f in faculty %}<div class="admin-item">{% if f.photo %}<img src="{{url_for('static',filename='uploads/'+f.photo)}}">{% else %}<div class="avatar">👤</div>{% endif %}<div><b>{{f.name}}</b><p>{{f.designation}} · {{f.qualification}}</p></div><a class="danger" href="{{url_for('delete_faculty',fid=f.id)}}" onclick="return confirm('Delete this faculty member?')">Delete</a></div>{% endfor %}</div>{% endblock %}

{% extends "base.html" %}

{% block content %}
<section class="page-head">
  <span class="eyebrow">OUR FACULTY</span>
  <h1>Faculty</h1>
  <p>Meet our teaching staff.</p>
</section>

<section class="section">
  <div class="grid three">
    {% for f in faculty %}
    <div class="person">
      {% if f.photo %}
      <img src="{{ url_for('static', filename='uploads/' + f.photo) }}" alt="{{ f.name }}">
      {% else %}
      <div class="avatar">👤</div>
      {% endif %}

      <h2>{{ f.name }}</h2>
      <p>{{ f.designation }}</p>
      <p>{{ f.qualification }}</p>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}

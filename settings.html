{% extends "admin/layout.html" %}{% block admin_content %}<h1>College Settings</h1><form class="form admin-form" method="post" enctype="multipart/form-data"><label>College Name<input name="college_name" value="{{settings.college_name}}" required></label><label>Tagline<input name="tagline" value="{{settings.tagline}}"></label><label>About<textarea name="about" rows="6">{{settings.about}}</textarea></label><label>Address<input name="address" value="{{settings.address}}"></label><label>Phone<input name="phone" value="{{settings.phone}}"></label><label>Email<input name="email" value="{{settings.email}}"></label><label>College Logo<input type="file" name="logo" accept="image/*"></label>{% if settings.logo %}<img class="preview-logo" src="{{url_for('static',filename='uploads/'+settings.logo)}}">{% endif %}<button class="btn">Save Changes</button></form>{% endblock %}

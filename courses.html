{% extends "base.html" %}

{% block content %}
<section class="page-head">
  <span class="eyebrow">ACADEMIC PROGRAMS</span>
  <h1>Courses</h1>
  <p>Explore our courses and programs.</p>
</section>

<section class="section">
  <div class="grid three">
    {% for c in courses %}
    <div class="card">
      <h3>{{ c.name }}</h3>
      <p><strong>Duration:</strong> {{ c.duration }}</p>
      <p>{{ c.description }}</p>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}

{% extends "admin/layout.html" %}{% block admin_content %}<h1>Courses Management</h1><form class="form admin-form" method="post"><label>Course Name<input name="name" required></label><label>Duration<input name="duration"></label><label>Description<textarea name="description" rows="4"></textarea></label><button class="btn">Add Course</button></form><div class="admin-list">{% for c in courses %}<div class="admin-item"><div><b>{{c.name}}</b><p>{{c.duration}} · {{c.description}}</p></div><a class="danger" href="{{url_for('delete_course',cid=c.id)}}">Delete</a></div>{% endfor %}</div>{% endblock %}

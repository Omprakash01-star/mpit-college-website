{% extends "admin/layout.html" %}{% block admin_content %}<h1>Notice Board</h1><form class="form admin-form" method="post"><label>Title<input name="title" required></label><label>Content<textarea name="content" rows="4"></textarea></label><button class="btn">Add Notice</button></form><div class="admin-list">{% for n in notices %}<div class="admin-item"><div><b>{{n.title}}</b><p>{{n.content}}</p><small>{{n.created_at}}</small></div><a class="danger" href="{{url_for('delete_notice',nid=n.id)}}">Delete</a></div>{% endfor %}</div>{% endblock %}

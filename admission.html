{% extends "base.html" %}{% block content %}<section class="page-head"><span class="eyebrow">ADMISSIONS</span><h1>Admission Enquiry</h1><p>Fill the form and the college can contact you.</p></section><section class="section"><form class="form" method="post"><label>Name *<input name="name" required></label><label>Phone *<input name="phone" required></label><label>Email<input type="email" name="email"></label><label>Course<select name="course"><option value="">Select course</option>{% for c in courses %}<option>{{c.name}}</option>{% endfor %}</select></label><label>Message<textarea name="message" rows="5"></textarea></label><button class="btn">Submit Enquiry</button></form></section>{% endblock %}
